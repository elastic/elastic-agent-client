---
name: setup
description: Common tasks for preparing the environment

runs:
  using: "composite"
  steps:
      # go.mod declares the minimum Go version for users of this library
      # (e.g. 1.26.0). CI should not be pinned to that exact patch release,
      # so take only major.minor from the go line and let setup-go pick a
      # matching release (e.g. 1.26.x).
      - name: determine Go version
        id: go-version
        shell: bash
        run: |
          minor=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
          if [ -z "$minor" ]; then
            echo "::error file=go.mod::could not read the go directive"
            exit 1
          fi
          echo "version=${minor}.x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - name: install mage
        run: go install github.com/magefile/mage
        shell: 'bash'
